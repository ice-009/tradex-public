name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Build-time settings only; nothing here is a real secret.
      NEXTAUTH_SECRET: ci-only-not-a-secret
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: file:./dev.db
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (layer rules)
        run: npm run lint
      - name: Unit tests with coverage (floor for src/core)
        run: npm run test:coverage
      - name: Coverage report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - name: Production build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Runtime dependencies only; fails on high or critical advisories (the full list is printed either way).
      - run: npm audit --omit=dev --audit-level=high

  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  e2e:
    name: End-to-end tests
    needs: playwright-version
    runs-on: ubuntu-latest
    # The same browsers and fonts as the screenshot baselines (e2e/__screenshots__) were rendered with.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    env:
      # Build-time settings only; nothing here is a real secret.
      NEXTAUTH_SECRET: ci-only-not-a-secret
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: file:./dev.db
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Production build
        run: npm run build
      - name: Playwright (smoke flows + chart screenshots, against a stub hub)
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      # A missing or changed baseline: this holds the screenshots rendered here, to review and commit.
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: e2e-screenshots
          path: |
            e2e/__screenshots__/
            test-results/**/*-actual.png
          if-no-files-found: ignore
          retention-days: 14

  # The one-command install: builds the Tradex image and the hub (from its
  # repo), starts the stack with no .env and no broker keys, and checks that
  # Tradex is up, runs as non-root, holds a working hub key, works in the hub's
  # end-of-day mode (charts, quotes, screens, backtests, plan), and keeps its
  # data across a restart. NSE is replaced by e2e/nse-stub.mjs
  # (e2e/compose.no-broker.yaml), so CI makes no request to NSE.
  docker:
    runs-on: ubuntu-latest
    env:
      TRADEX_PORT: "3100"
      COMPOSE_FILE: compose.yaml:e2e/compose.no-broker.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # End-of-day mode is market-data-hub#32: build that branch until it is on the hub's main.
      # (Remove this step once it has merged; compose.yaml then builds main as usual.)
      - name: Pick the hub version
        run: |
          # A commit, not the branch name: HUB_REF is also the image tag, which can't hold a "/".
          if curl -fsS https://raw.githubusercontent.com/ice-009/market-data-hub/main/src/status.ts | grep -q end_of_day; then ref=main; else ref=$(git ls-remote https://github.com/ice-009/market-data-hub.git refs/heads/feat/32-no-broker | cut -f1); fi
          test -n "$ref"
          echo "HUB_REF=$ref" >> "$GITHUB_ENV"
          echo "Building the hub from $ref"
      - name: docker compose up (no .env, no broker keys)
        run: |
          test ! -e .env
          docker compose up -d --build
      - name: Tradex is healthy and connected to the hub
        run: |
          wait_healthy() {
            for i in $(seq 1 90); do
              curl -fsS http://127.0.0.1:3100/api/health > health.json 2>/dev/null && return 0
              sleep 2
            done
            return 1
          }
          wait_healthy
          cat health.json; echo
          grep -q '"hub":true' health.json
          test "$(docker compose exec -T tradex id -u)" != "0"
          docker compose exec -T tradex node -e "fetch('http://hub:8787/v1/status', { headers: { authorization: 'Bearer ' + require('fs').readFileSync('/run/hub/tradex', 'utf8') } }).then((r) => { console.log('hub /v1/status with the generated key:', r.status); process.exit(r.ok ? 0 : 1); })"
          curl -fsS -X POST http://127.0.0.1:3100/api/auth/signup -H 'content-type: application/json' -d '{"email":"ci@example.com","password":"ci-only-password","name":"CI"}'
          echo
      - name: Without a broker, charts, quotes, screens and backtests work
        # The hub holds only its two-week catch-up here (no archive download), so a backtest may say the history is too short.
        run: SHORT_HISTORY=1 node e2e/no-broker-smoke.mjs http://127.0.0.1:3100
      - name: Data survives a restart
        run: |
          docker compose down
          docker compose up -d
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:3100/api/health && break; sleep 2; done
          echo
          docker compose logs hub-key | grep -q "already exists"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3100/api/auth/signup -H 'content-type: application/json' -d '{"email":"ci@example.com","password":"ci-only-password","name":"CI"}')" = "400"
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down -v
