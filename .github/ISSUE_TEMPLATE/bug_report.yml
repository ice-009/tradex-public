name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **never paste your `.env`, tokens, PIN or TOTP secret** — redact them from logs.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Data source
      options:
        - Fyers connected
        - No broker (end-of-day / sample data)
        - Not sure
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Device / browser / OS
      placeholder: e.g. iPad 11" Safari, MacBook Chrome 130, Node 22 on macOS
  - type: textarea
    id: logs
    attributes:
      label: Server log or browser console (redacted)
      render: text
